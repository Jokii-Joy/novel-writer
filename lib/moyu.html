<!doctype html>
<html lang="zh-CN">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>文档1 - Word</title>
  <style>
    :root {
      --paper: #ffffff;
      --ink: #202124;
      --muted: #9aa0a6;
      --word-blue: #1a73e8;
    }
    * { box-sizing: border-box; }
    html, body {
      width: 100%;
      height: 100%;
      margin: 0;
      overflow: hidden;
      background: var(--paper);
    }
    body {
      display: flex;
      flex-direction: column;
      color: var(--ink);
      font-family: "DengXian", "等线", "Microsoft YaHei", "PingFang SC", sans-serif;
      -webkit-user-select: none;
      user-select: none;
    }
    #drag {
      flex: 0 0 13px;
      -webkit-app-region: drag;
      cursor: grab;
      position: relative;
      background: var(--paper);
    }
    #drag:active { cursor: grabbing; }
    #hint {
      position: absolute;
      right: 30px;
      top: 1px;
      font-size: 9px;
      line-height: 11px;
      letter-spacing: .02em;
      color: var(--muted);
      opacity: 0;
      transition: opacity .16s ease;
    }
    body:hover #hint { opacity: .62; }
    #close {
      -webkit-app-region: no-drag;
      position: absolute;
      right: 7px;
      top: 0;
      width: 18px;
      height: 18px;
      padding: 0;
      border: 0;
      border-radius: 4px;
      background: transparent;
      color: var(--muted);
      font: 15px/17px "Segoe UI", sans-serif;
      cursor: pointer;
      opacity: 0;
      transition: opacity .16s ease, color .16s ease, background .16s ease;
    }
    body:hover #close { opacity: .7; }
    #close:hover { opacity: 1; color: #b3261e; background: rgba(179, 38, 30, .08); }
    #editor {
      flex: 1 1 auto;
      width: 100%;
      min-height: 0;
      margin: 0;
      padding: 0 30px 14px;
      border: 0;
      outline: 0;
      resize: none;
      overflow-y: auto;
      background: transparent;
      color: var(--ink);
      caret-color: var(--word-blue);
      font: 15.5px/1.9 "DengXian", "等线", "Microsoft YaHei", "PingFang SC", sans-serif;
      letter-spacing: .01em;
      white-space: pre-wrap;
      word-break: break-word;
      tab-size: 2;
      -webkit-user-select: text;
      user-select: text;
    }
    #editor::selection { background: #cfe2ff; }
    #editor::-webkit-scrollbar { width: 0; height: 0; }
    #editor::placeholder { color: #b8bcc2; }
  </style>
</head>
<body>
  <div id="drag">
    <span id="hint">Alt+` 收起</span>
    <button id="close" type="button" title="收起（Alt+`）" aria-label="收起">×</button>
  </div>
  <textarea id="editor" spellcheck="false" placeholder="接着写……"></textarea>
  <script>
    (() => {
      const editor = document.getElementById('editor');
      const close = document.getElementById('close');
      let alive = true;

      function hide() {
        if (!alive) return;
        alive = false;
        try {
          window.moyu.hide(editor.value);
        } catch (err) {
          window.close();
        }
      }

      function commitInput() {
        if (!alive) return;
        try {
          window.moyu.draft(editor.value);
        } catch (err) {
          /* the bridge is only absent when the page is opened outside Electron */
        }
      }

      async function init() {
        try {
          const state = await window.moyu.init();
          editor.value = state && typeof state.text === 'string' ? state.text : '';
        } catch (err) {
          editor.value = '';
        }
        // The writer almost always wants to continue at the end of the chapter.
        requestAnimationFrame(() => {
          editor.scrollTop = editor.scrollHeight;
          editor.focus();
          const end = editor.value.length;
          try { editor.setSelectionRange(end, end); } catch (err) { /* noop */ }
        });
      }

      editor.addEventListener('input', commitInput);
      editor.addEventListener('keydown', (event) => {
        if (event.key === 'Escape') {
          event.preventDefault();
          hide();
          return;
        }
        if ((event.ctrlKey || event.metaKey) && event.key.toLowerCase() === 's') {
          event.preventDefault();
          hide();
        }
      });
      close.addEventListener('click', hide);
      window.addEventListener('beforeunload', () => {
        try { window.moyu.draft(editor.value); } catch (err) { /* noop */ }
      });
      init();
    })();
  </script>
</body>
</html>
